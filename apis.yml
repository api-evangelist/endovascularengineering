name: Endovascularengineering
description: 'Endovascular Engineering is a medical-device company developing minimally invasive
  thrombectomy technology for the removal of blood clots. Its lead product, the Helo PE Thrombectomy
  System, targets pulmonary embolism, pairing a small catheter profile with large-bore clot engagement
  via a self-expanding funnel and dual-action high-speed agitation plus physician-controlled aspiration
  for single-pass navigation of complex vasculature. The Helo system is investigational only and not
  commercially available. Backed by Norwest Venture Partners. The company publishes a marketing and
  clinical-overview website but no public developer, API, SDK, or technical-documentation surface.'
